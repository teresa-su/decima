[project]
name = "decima-stars"
version = "0.1.0"
description = "Stellar ages, [Fe/H], [alpha/Fe], distances and extinctions from spectroscopy + Gaia/2MASS with neural posterior estimation on MIST isochrones"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch>=2.5",
    "sbi>=0.27,<0.28",  # the flows are rebuilt with sbi's builders (decima.models)
    "nflows",
    "zuko>=1.5,<1.6",  # zuko 1.6 renamed the base-distribution buffers (net.base._0/_1 -> loc/scale): prior_spec.pt no longer loads
    "astropy",
    "healpy",
    "h5py",
    "pooch",
]

[project.optional-dependencies]
zeropoint = ["gaiadr3-zeropoint"] # Config.parallax_zero_point

[project.scripts]
decima = "decima.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decima"]

[dependency-groups]
dev = ["pytest", "gaiadr3-zeropoint", "ipykernel", "matplotlib"] # tests, and running the notebooks in docs/
docs = ["mkdocs-material", "mkdocs-jupyter", "mkdocstrings[python]", "jupytext", "nbmake", "pytest-markdown-docs"] # building the docs site and testing the docs

[tool.uv]
# The regression test compares against isosbi (sbi 0.25) bit for bit; these versions pass it.
constraint-dependencies = ["torch==2.5.1", "sbi==0.27.0", "nflows==0.14", "zuko==1.5.0", "numpy==2.2.6"]

[tool.pytest.ini_options]
markers = ["slow: needs the full models (DECIMA_DATA_DIR) and a few minutes of CPU"]
