name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    # The unit tests that need no models; the regression and runner tests skip without DECIMA_DATA_DIR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
