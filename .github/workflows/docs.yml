name: docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    # Needs Settings > Pages > Source: "Deploy from a branch", branch gh-pages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group docs
      - run: NO_MKDOCS_2_WARNING=1 uv run mkdocs gh-deploy --force
